<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zenkai Tools v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Bangers&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body data-theme="comic">

    <audio id="bgm" loop>
        <source id="bgm-source" src="" type="audio/mpeg">
    </audio>

    <button id="music-toggle" class="fab-music" title="Putar Musik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <div id="toast-container" class="toast-container"></div>

    <div class="app-container">
        <main id="page-tools" class="page active">
            
            <header class="header-box anim-reveal" style="--delay: 0.1s;">
                <div class="logo-area">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </div>
                    <div class="logo-text">
                        <h1>ZenkaiTools <span>v1</span></h1>
                        <p class="version">By Andika T.M</p>
                    </div>
                </div>
                <button class="theme-btn" onclick="switchTheme()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </header>

            <div class="hero-section anim-reveal" style="--delay: 0.2s;">
                <div class="hero-media-only">
                    <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1614729939124-03290b5609ce?q=80&w=1000&auto=format&fit=crop">
                        <source src="https://cdn.pixabay.com/video/2022/10/24/136208-764488701_large.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <div class="tools-section anim-reveal" style="--delay: 0.3s;">
                <div class="section-header">
                    <h3>MODULES</h3>
                    <div class="search-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-tools" placeholder="Cari modul...">
                    </div>
                </div>

                <div class="grid-tools" id="tools-grid">
                    <div class="tool-card" onclick="openTool('tiktok')"><div class="t-icon bg-cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><h4>TikTok DL</h4></div>
                    <div class="tool-card" onclick="openTool('qr')"><div class="t-icon bg-yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><h4>QR Code</h4></div>
                    <div class="tool-card" onclick="openTool('brat')"><div class="t-icon bg-pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></div><h4>Brat Text</h4></div>
                    <div class="tool-card" onclick="openTool('calc')"><div class="t-icon bg-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg></div><h4>Kalkulator</h4></div>
                    <div class="tool-card" onclick="openTool('zodiak')"><div class="t-icon bg-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg></div><h4>Zodiak</h4></div>
                </div>
            </div>
            <div class="credit-text">Engineered by <b>Andika T.M</b></div>
        </main>
    </div>

    <!-- CUSTOM BOTTOM SHEET / MODAL -->
    <div class="bottom-sheet-overlay" id="tool-modal" onclick="closeModalOnOverlay(event)">
        <div class="bottom-sheet-content" id="modal-content">
            <!-- Konten diisi JS -->
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
