<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zenkai Tools v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Bangers&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body data-theme="comic">

    <audio id="bgm" loop>
        <source id="bgm-source" src="" type="audio/mpeg">
    </audio>

    <button id="music-toggle" class="fab-music" title="Putar Musik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <div id="toast-container" class="toast-container"></div>

    <div class="app-container">
        <!-- ================= PAGE 1: TOOLS ================= -->
        <main id="page-tools" class="page active">
            <header class="header-box anim-reveal" style="--delay: 0.1s;">
                <div class="logo-area">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </div>
                    <div class="logo-text">
                        <h1>ZenkaiTools <span>v1</span></h1>
                        <p class="version">By Andika T.M</p>
                    </div>
                </div>
                <button class="theme-btn" onclick="switchTheme()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </header>

            <div class="hero-section anim-reveal" style="--delay: 0.2s;">
                <div class="hero-media-only">
                    <video autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1614729939124-03290b5609ce?q=80&w=1000&auto=format&fit=crop">
                        <source src="https://cdn.pixabay.com/video/2022/10/24/136208-764488701_large.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

            <div class="tools-section anim-reveal" style="--delay: 0.3s;">
                <div class="section-header">
                    <h3>MODULES</h3>
                    <div class="search-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="search-tools" placeholder="Cari modul...">
                    </div>
                </div>

                <div class="grid-tools" id="tools-grid">
                    <!-- SEMUA FITUR DIKEMBALIKAN -->
                    <div class="tool-card" onclick="openTool('tiktok')"><div class="t-icon bg-cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><h4>TikTok DL</h4></div>
                    <div class="tool-card" onclick="openTool('qr')"><div class="t-icon bg-yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div><h4>QR Code</h4></div>
                    <div class="tool-card" onclick="openTool('brat')"><div class="t-icon bg-pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></div><h4>Brat Text</h4></div>
                    <div class="tool-card" onclick="openTool('base64')"><div class="t-icon bg-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div><h4>Base64</h4></div>
                    <div class="tool-card" onclick="openTool('ip')"><div class="t-icon bg-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><h4>IP Lookup</h4></div>
                    <div class="tool-card" onclick="openTool('imgto')"><div class="t-icon bg-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><h4>Image Link</h4></div>
                    <div class="tool-card" onclick="openTool('password')"><div class="t-icon bg-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><h4>Password</h4></div>
                    <div class="tool-card" onclick="openTool('calc')"><div class="t-icon bg-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg></div><h4>Kalkulator</h4></div>
                    <div class="tool-card" onclick="openTool('zodiak')"><div class="t-icon bg-yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg></div><h4>Zodiak</h4></div>
                    <div class="tool-card" onclick="openTool('cuaca')"><div class="t-icon bg-cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg></div><h4>Cuaca</h4></div>
                    <div class="tool-card" onclick="openTool('quotes')"><div class="t-icon bg-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></div><h4>Quotes</h4></div>
                    <div class="tool-card" onclick="openTool('bmi')"><div class="t-icon bg-pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg></div><h4>Hitung BMI</h4></div>
                </div>
            </div>
            <div class="credit-text">Engineered by <b>Andika T.M</b></div>
        </main>
    </div>

    <!-- NAV LAYOUT -->
    <nav class="bottom-nav">
        <button class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Tools</span>
        </button>
    </nav>

    <!-- CUSTOM BOTTOM SHEET -->
    <div class="bottom-sheet-overlay" id="tool-modal" onclick="closeModalOnOverlay(event)">
        <div class="bottom-sheet-content" id="modal-content">
            <!-- Konten diisi JS -->
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
