<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 18+</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #1a0033, #330066);
  color: #fff;
  min-height: 100vh;
  padding: 16px;
}
#app {
  max-width: 480px;
  margin: auto;
  background: rgba(0,0,0,0.5);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 30px rgba(255,0,128,0.3);
}
h1 { text-align: center; margin-bottom: 16px; color: #ff66b3; }
#stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 14px;
}
#stats div { background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; }
#cerita {
  background: rgba(255,255,255,0.08);
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 14px;
  line-height: 1.5;
  min-height: 80px;
}
#pilihan button {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 12px;
  background: #ff3399;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
}
#pilihan button:hover { background: #ff66b3; transform: scale(1.02); }
#log {
  margin-top: 14px;
  font-size: 13px;
  color: #ffccdd;
  max-height: 120px;
  overflow-y: auto;
}
</style>
</head>
<body>
<div id="app">
  <h1 id="judul">🌙 Malam Pertama</h1>
  <div id="stats">
    <div>❤️ HP: <span id="hp">100</span></div>
    <div>⚡ Energy: <span id="energy">100</span></div>
    <div>🔥 Lust: <span id="lust">0</span></div>
    <div>💕 Mood NPC: <span id="mood">50</span></div>
  </div>
  <div id="cerita">Kamu baru sampai di rumah. Ayu sedang duduk di sofa.</div>
  <div id="pilihan"></div>
  <div id="log"></div>
</div>
<script>
const state = { hp: 100, energy: 100, lust: 0, mood: 50, hari: 1 };
const npc = { nama: "Ayu", kesukaan: ["rayu","sentuh","cium"], kebencian: ["paksa","kasar"] };

const skenario = [
  {
    teks: "Kamu duduk di samping Ayu. Dia tersenyum tipis.",
    pilihan: [
      { label: "Rayu dengan lembut", aksi: "rayu" },
      { label: "Cium dia", aksi: "cium" },
      { label: "Langsung tindih", aksi: "paksa" },
      { label: "Diam saja", aksi: "diam" }
    ]
  },
  {
    teks: "Ayu mendekatkan wajahnya. Nafasnya hangat.",
    pilihan: [
      { label: "Sentuh pipinya", aksi: "sentuh" },
      { label: "Cium bibirnya", aksi: "cium" },
      { label: "Buka bajunya", aksi: "buka" },
      { label: "Tanya dulu", aksi: "tanya" }
    ]
  },
  {
    teks: "Suasana makin panas. Ayu menatap matamu.",
    pilihan: [
      { label: "Lanjut ke ranjang", aksi: "ranjang" },
      { label: "Peluk erat dulu", aksi: "peluk" },
      { label: "Matikan lampu", aksi: "lampu" },
      { label: "Sudahi malam ini", aksi: "stop" }
    ]
  }
];

function render() {
  document.getElementById("hp").textContent = state.hp;
  document.getElementById("energy").textContent = state.energy;
  document.getElementById("lust").textContent = state.lust;
  document.getElementById("mood").textContent = state.mood;
}
function log(msg) {
  const el = document.getElementById("log");
  el.innerHTML = "> " + msg + "<br>" + el.innerHTML;
}
function nextSkenario() {
  const idx = Math.min(state.hari - 1, skenario.length - 1);
  const sk = skenario[idx];
  document.getElementById("cerita").textContent = sk.teks;
  const wrap = document.getElementById("pilihan");
  wrap.innerHTML = "";
  sk.pilihan.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.label;
    b.onclick = () => handle(p.aksi);
    wrap.appendChild(b);
  });
}
function handle(aksi) {
  if (state.energy <= 0) { log("Energy habis. Kamu butuh istirahat."); return; }
  state.energy -= 10;
  if (npc.kesukaan.includes(aksi)) {
    state.mood += 15; state.lust += 10;
    log(`${npc.nama} suka. Mood +15, Lust +10`);
  } else if (npc.kebencian.includes(aksi)) {
    state.mood -= 25; state.hp -= 10;
    log(`${npc.nama} tidak suka. Mood -25, HP -10`);
  } else {
    state.mood += 5; state.lust += 5;
    log(`${npc.nama} oke. Mood +5, Lust +5`);
  }
  state.hari++;
  render();
  if (state.mood >= 100 && state.lust >= 50) {
    document.getElementById("cerita").textContent = `🔥 ${npc.nama} menyerah. Kamu berhasil. Ending: SUCCESS`;
    document.getElementById("pilihan").innerHTML = "";
    log("ENDING SUCCESS"); return;
  }
  if (state.mood <= 0) {
    document.getElementById("cerita").textContent = `💔 ${npc.nama} kabur. Ending: GAGAL`;
    document.getElementById("pilihan").innerHTML = "";
    log("ENDING GAGAL"); return;
  }
  nextSkenario();
}
render();
nextSkenario();
</script>
</body>
</html>
