<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Andika Tools // Utility Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
</head>
<body>

    <!-- BGM (Musik Viral) -->
    <audio id="bgm" loop>
        <source src="https://www.myinstants.com/media/sounds/astaga-bercanda.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Musik -->
    <button id="music-toggle" class="fab-music" title="Putar Musik">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header-box">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="logo-text">
                    <h1>ANDIKA<br>TOOLS</h1>
                </div>
            </div>
            <div class="header-status">
                <span id="device-status">Device</span>
            </div>
        </header>

        <!-- KOTAK BESAR: HERO (FOTO/VIDEO) -->
        <div class="main-card">
            <div class="hero-media-box">
                <!-- GANTI SRC DI BAWAH INI PAKAI FOTO/VIDEO LU SENDIRI -->
                <img src="https://picsum.photos/seed/andika/800/400" alt="Hero Media" id="hero-image">
            </div>
            
            <h2 class="welcome-text">Selamat datang di Andika Tools!</h2>
            
            <div class="info-grid">
                <div class="info-card">
                    <svg class="info-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                    <div>
                        <span>DEVICE</span>
                        <strong id="device-name">...</strong>
                    </div>
                </div>
                <div class="info-card">
                    <svg class="info-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
                    <div>
                        <span>BATTERY</span>
                        <strong id="battery-level">--%</strong>
                    </div>
                </div>
                <div class="info-card">
                    <svg class="info-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <div>
                        <span>TANGGAL</span>
                        <strong id="date-now">--</strong>
                    </div>
                </div>
                <div class="info-card">
                    <svg class="info-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <div>
                        <span>JAM</span>
                        <strong id="clock-now">--:--</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- MENU TOOLS (Efek Cutscene) -->
        <div class="tools-container">
            <div class="tools-header">
                <h3 class="section-title">TOOLS</h3>
                <div class="search-bar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-tools" placeholder="Cari tools...">
                </div>
            </div>

            <!-- Grid ID ini yang bakal di-render JS pakai efek cutscene -->
            <div class="grid-tools" id="tools-grid">
                <!-- Item bakal dimasukin otomatis sama JS biar bisa animasi satu-satu -->
            </div>
        </div>
    </div>

    <!-- MODAL TOOL -->
    <div class="modal-overlay" id="tool-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
