<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Zenkai Tools - Super App All-in-One with Supabase">
<meta name="theme-color" content="#fbbf24">
<title>Zenkai Tools - Secure Cloud Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--c-border:#1a1a1a;--c-shadow:#1a1a1a;--radius:14px;--gap:12px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
body{font-family:'Comic Neue',system-ui,sans-serif;background:#fbbf24;color:#1a1a1a;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;-webkit-tap-highlight-color:transparent;user-select:none}
.font-title{font-family:'Bangers',cursive;letter-spacing:1.2px}
.font-arab{font-family:'Amiri',serif}
.comic-panel{background:#fff;border:2.5px solid #1a1a1a;box-shadow:3px 3px 0 0 #1a1a1a;border-radius:14px;position:relative;overflow:hidden}
.comic-bubble{background:#fef3c7;border:2.5px solid #1a1a1a;border-radius:14px;box-shadow:2.5px 2.5px 0 0 #1a1a1a;padding:10px}
.sec-gap{display:flex;flex-direction:column;gap:12px}
.txt-sm{font-size:.8rem;line-height:1.4}
.txt-xs{font-size:.7rem;line-height:1.35}
.svg-icon{display:inline-block;vertical-align:middle;width:1em;height:1em;fill:currentColor;flex-shrink:0}
.svg-icon-lg{width:1.35em;height:1.35em}
.svg-icon-2xl{width:2em;height:2em}
.loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .28s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.splash-screen{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);transition:opacity .5s,visibility .5s}
.splash-screen.hide{opacity:0;visibility:hidden}
.splash-logo{font-family:'Bangers',cursive;font-size:clamp(38px,11vw,52px);color:#000;letter-spacing:3px;text-shadow:3px 3px 0 #fff,5px 5px 0 #000}
.splash-bar-wrap{width:180px;height:14px;background:#000;border-radius:10px;margin-top:26px;padding:3px;border:2.5px solid #000;box-shadow:2.5px 2.5px 0 #000}
.splash-bar{height:100%;background:linear-gradient(90deg,#86efac,#22c55e);border-radius:6px;width:0%;transition:width .25s}
.bottom-nav-btn{flex:1;border:2px solid #000;border-radius:10px;margin:0 1.5px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff}
.bottom-nav-btn.active{background:#000;color:#fde68a}
.bottom-nav-label{font-family:'Bangers',cursive;font-size:8px;letter-spacing:.5px;line-height:1}
</style>
</head>
<body x-data="zenkaiCloudApp()" x-init="init()">

<!-- SPLASH SCREEN -->
<div class="splash-screen" :class="{ 'hide': splashHidden }">
  <div class="splash-logo">ZENKAI TOOLS</div>
  <div class="splash-bar-wrap"><div class="splash-bar" :style="'width:' + splashProgress + '%'"></div></div>
  <div class="mt-2 text-xs font-bold" x-text="splashText"></div>
</div>

<!-- CUSTOM MODAL SHEET (Ganti Alert/Confirm Bawaan Browser) -->
<div x-show="sheetOpen" class="fixed inset-0 bg-black/80 z-[100000] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-xs">
  <div class="comic-panel bg-white w-full max-w-sm p-5 space-y-4 rounded-t-2xl sm:rounded-2xl border-4 border-black">
    <h3 class="font-title text-xl text-purple-900" x-text="sheetTitle"></h3>
    <p class="txt-sm font-bold text-gray-800" x-text="sheetMessage"></p>
    <div class="flex gap-2 pt-2">
      <button @click="sheetOpen = false" class="flex-1 bg-gray-200 border-2 border-black py-2.5 rounded-xl font-title text-sm">TUTUP</button>
    </div>
  </div>
</div>

<!-- AUTH / LOGIN MODAL (GMAIL, PASSWORD & GOOGLE OAUTH) -->
<div x-show="!isAuthenticated" class="fixed inset-0 bg-black/85 z-[9997] flex items-center justify-center p-4 backdrop-blur-sm">
  <div class="comic-panel bg-yellow-300 p-6 w-full max-w-sm text-center space-y-4">
    <div class="bg-black text-yellow-300 font-title text-2xl px-3 py-1 rounded-xl border-2 border-black inline-block rotate-[-2deg]">CLOUD PORTAL</div>
    <h2 class="font-title text-2xl text-black" x-text="authMode === 'login' ? 'MASUK AKUN' : 'DAFTAR AKUN'"></h2>
    <p class="txt-xs font-bold" x-text="authMode === 'login' ? 'Gunakan Email & Password atau Login Google' : 'Buat akun baru Supabase'"></p>
    
    <input type="email" x-model="authEmail" placeholder="Email / Gmail..." class="w-full border-2 border-black p-3 rounded-xl font-bold text-sm bg-white text-center focus:outline-none" autocomplete="off">
    <input type="password" x-model="authPassword" placeholder="Password..." class="w-full border-2 border-black p-3 rounded-xl font-bold text-sm bg-white text-center focus:outline-none">
    <template x-if="authMode === 'register'">
      <input type="text" x-model="authUsername" placeholder="Nama Tampilan..." class="w-full border-2 border-black p-3 rounded-xl font-bold text-sm bg-white text-center focus:outline-none" autocomplete="off">
    </template>
    
    <button @click="handleEmailAuth()" class="w-full bg-cyan-400 hover:bg-cyan-500 border-2 border-black py-3 rounded-xl font-title text-xl flex items-center justify-center gap-2">
      <span x-text="authMode === 'login' ? 'MASUK DENGAN EMAIL' : 'DAFTAR SEKARANG'"></span>
    </button>

    <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t-2 border-black"></div>
      <span class="flex-shrink mx-4 text-xs font-bold">ATAU</span>
      <div class="flex-grow border-t-2 border-black"></div>
    </div>

    <!-- TOMBOL LOGIN INSTAN GOOGLE OAUTH -->
    <button @click="loginWithGoogle()" class="w-full bg-white hover:bg-gray-100 border-2 border-black py-3 rounded-xl font-title text-sm flex items-center justify-center gap-2">
      <span>🌐 MASUK INSTAN DENGAN GOOGLE</span>
    </button>

    <button @click="authMode = authMode === 'login' ? 'register' : 'login'" class="text-xs font-bold underline cursor-pointer bg-transparent border-none text-blue-900 mt-2">
      <span x-text="authMode === 'login' ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Login'"></span>
    </button>
  </div>
</div>

<!-- MAIN APP CONTAINER -->
<div class="w-full max-w-md h-[100dvh] border-x-4 border-b-4 border-black relative flex flex-col shadow-2xl overflow-hidden bg-yellow-50">
  
  <!-- HEADER -->
  <header class="bg-yellow-400 text-black border-b-4 border-black p-3 shrink-0 z-40 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <div class="bg-black text-yellow-300 font-title text-lg px-2 py-0.5 rounded-xl border-2 border-black rotate-[-3deg]" x-text="userName ? userName.substring(0,2).toUpperCase() : 'ZK'"></div>
      <div>
        <h1 class="font-title text-xl leading-none">ZENKAI TOOLS</h1>
        <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded border border-black" :class="isOwner ? 'bg-purple-600 text-white' : 'bg-white text-black'" x-text="isOwner ? 'Master Owner' : 'Cloud User'"></span>
      </div>
    </div>
    <div class="flex items-center space-x-1.5">
      <div class="bg-white text-black border-2 border-black px-2 py-1 rounded-lg font-bold text-[10px]" x-text="currentTime"></div>
      <button @click="logout()" class="bg-red-400 hover:bg-red-500 border-2 border-black px-2 py-1 rounded-lg font-bold text-xs">🚪</button>
    </div>
  </header>

  <!-- CONTENT TABS -->
  <main class="p-3 flex-1 overflow-y-auto space-y-3 pb-24">
    
    <!-- TAB HOME -->
    <div x-show="activeTab === 'home'" class="sec-gap fade-in">
      <div class="comic-panel bg-cyan-300 text-black p-3 flex items-center space-x-3">
        <div class="w-16 h-16 bg-yellow-300 border-2 border-black rounded-xl flex items-center justify-center font-title text-2xl" x-text="userName ? userName.substring(0,1).toUpperCase() : 'U'"></div>
        <div>
          <div class="font-title text-purple-900 text-sm">Halo, <span x-text="userName"></span>!</div>
          <span class="text-xs font-bold" x-text="isOwner ? 'Akses Owner Terverifikasi (Email Valid)' : 'Akses Cloud User Aktif'"></span>
        </div>
      </div>
      
      <div class="comic-panel bg-white p-3 sec-gap">
        <h3 class="font-title text-sm">📝 CATATAN KILAT CLOUD</h3>
        <textarea x-model="quickNote" @input="saveQuickNoteCloud()" rows="3" placeholder="Tulis ide kamu..." class="w-full border-2 border-black p-2 rounded-xl font-bold text-[12px] bg-yellow-50 focus:outline-none"></textarea>
      </div>
    </div>

    <!-- TAB DOMPET KEUANGAN -->
    <div x-show="activeTab === 'keuangan'" class="sec-gap fade-in">
      <div class="comic-panel bg-pink-400 text-black p-3">
        <h2 class="font-title text-2xl text-white">💰 DOMPET KEUANGAN CLOUD</h2>
      </div>
      <div class="comic-panel bg-yellow-300 text-black p-3 flex justify-between items-center">
        <div>
          <div class="text-[10px] font-bold uppercase">Total Saldo</div>
          <div class="font-title text-2xl" x-text="'Rp ' + totalBalance.toLocaleString('id-ID')"></div>
        </div>
      </div>
      <div class="comic-panel bg-white p-3.5 sec-gap">
        <h3 class="font-title text-lg">Catat Transaksi</h3>
        <input type="text" x-model="txCategory" placeholder="Kategori (Gaji/Makan)..." class="w-full border-2 border-black p-2 rounded-xl font-bold text-xs bg-yellow-50">
        <input type="number" x-model="txAmount" placeholder="Nominal (Rp)..." class="w-full border-2 border-black p-2 rounded-xl font-bold text-xs bg-yellow-50">
        <div class="grid grid-cols-2 gap-2">
          <button @click="addTransaction('income')" class="bg-green-400 border-2 border-black py-2 rounded-xl font-title text-sm">+ Pemasukan</button>
          <button @click="addTransaction('expense')" class="bg-red-400 text-white border-2 border-black py-2 rounded-xl font-title text-sm">- Pengeluaran</button>
        </div>
      </div>
      <div class="comic-panel bg-white p-3.5 sec-gap">
        <h3 class="font-title text-lg">Riwayat Cloud</h3>
        <div class="max-h-40 overflow-y-auto space-y-1.5">
          <template x-for="t in transactions" :key="t.id">
            <div class="border-2 border-black p-2 rounded-xl flex justify-between items-center text-xs" :class="t.type === 'income' ? 'bg-green-50' : 'bg-red-50'">
              <div>
                <span class="font-bold" x-text="t.category"></span>
                <span class="text-[10px] text-gray-600 block" x-text="t.date"></span>
              </div>
              <div class="font-bold" :class="t.type === 'income' ? 'text-green-700' : 'text-red-700'" x-text="(t.type === 'income' ? '+' : '-') + 'Rp ' + t.amount.toLocaleString('id-ID')"></div>
            </div>
          </template>
        </div>
      </div>
  </div>
      <!-- TAB KITAB & SHOLAT -->
    <div x-show="activeTab === 'kitab'" class="sec-gap fade-in">
      <div class="comic-panel bg-emerald-400 text-black p-3">
        <h2 class="font-title text-2xl text-white">📖 KITAB & SHOLAT</h2>
      </div>
      <div class="comic-panel bg-white p-3.5 sec-gap">
        <h3 class="font-title text-lg">Jadwal Sholat Hari Ini</h3>
        <div class="grid grid-cols-5 gap-1 text-center">
          <div class="comic-panel bg-yellow-100 p-1.5"><div class="text-[9px] font-bold">Subuh</div><div class="font-title txt-xs" x-text="prayerTimes.subuh || '--:--'"></div></div>
          <div class="comic-panel bg-yellow-100 p-1.5"><div class="text-[9px] font-bold">Dzuhur</div><div class="font-title txt-xs" x-text="prayerTimes.dzuhur || '--:--'"></div></div>
          <div class="comic-panel bg-yellow-100 p-1.5"><div class="text-[9px] font-bold">Ashar</div><div class="font-title txt-xs" x-text="prayerTimes.ashar || '--:--'"></div></div>
          <div class="comic-panel bg-yellow-100 p-1.5"><div class="text-[9px] font-bold">Maghrib</div><div class="font-title txt-xs" x-text="prayerTimes.maghrib || '--:--'"></div></div>
          <div class="comic-panel bg-yellow-100 p-1.5"><div class="text-[9px] font-bold">Isya</div><div class="font-title txt-xs" x-text="prayerTimes.isya || '--:--'"></div></div>
        </div>
      </div>
    </div>

    <!-- TAB ARCADE GAME -->
    <div x-show="activeTab === 'arcade'" class="sec-gap fade-in">
      <div class="comic-panel bg-yellow-400 text-black p-3">
        <h2 class="font-title text-2xl text-black">🎮 ARCADE GAME</h2>
        <p class="txt-xs font-bold">Uji kecepatan refleksmu!</p>
      </div>
      <div class="comic-panel bg-white p-3 sec-gap text-center">
        <div class="w-full h-40 border-3 border-black rounded-xl flex flex-col items-center justify-center cursor-pointer font-title text-2xl text-white"
             :class="reflexState === 'red' ? 'bg-red-500' : (reflexState === 'yellow' ? 'bg-yellow-500 text-black' : 'bg-green-500')"
             @click="handleReflexTap()">
          <span x-text="reflexMessage"></span>
        </div>
        <button @click="startReflexGame()" class="w-full bg-cyan-400 border-2 border-black py-2 rounded-xl font-title text-sm">Mulai Game</button>
      </div>
    </div>

    <!-- TAB OWNER PANEL (Hanya Terbuka Jika Email andikaatka@gmail.com) -->
    <template x-if="isOwner">
      <div x-show="activeTab === 'owner'" class="sec-gap fade-in">
        <div class="comic-panel bg-purple-600 p-4 text-white">
          <h2 class="font-title text-2xl">👑 OWNER CONTROL PANEL</h2>
          <p class="text-xs font-bold opacity-90">Akses Eksklusif Pemilik Sistem (andikaatka@gmail.com)</p>
        </div>
        <div class="comic-panel bg-purple-50 p-3 sec-gap">
          <h3 class="font-title text-base border-b-2 border-black pb-1">Broadcast Global</h3>
          <textarea x-model="newBroadcast" rows="2" placeholder="Pesan pengumuman..." class="w-full border-2 border-black p-2 rounded-xl font-bold text-xs bg-white"></textarea>
          <button @click="sendBroadcast()" class="w-full bg-yellow-300 border-2 border-black py-2 rounded-xl font-title text-xs">Kirim Broadcast</button>
        </div>
      </div>
    </template>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="absolute bottom-0 left-0 right-0 w-full border-t-4 border-black bg-yellow-300 flex justify-between items-center py-2 px-1 z-35">
    <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'active' : ''" class="bottom-nav-btn">
      <svg class="svg-icon-lg"><use href="#i-home"/></svg>
      <span class="bottom-nav-label">HOME</span>
    </button>
    <button @click="activeTab = 'kitab'" :class="activeTab === 'kitab' ? 'active' : ''" class="bottom-nav-btn">
      <svg class="svg-icon-lg"><use href="#i-book"/></svg>
      <span class="bottom-nav-label">KITAB</span>
    </button>
    <button @click="activeTab = 'keuangan'" :class="activeTab === 'keuangan' ? 'active' : ''" class="bottom-nav-btn">
      <svg class="svg-icon-lg"><use href="#i-wallet"/></svg>
      <span class="bottom-nav-label">DOMPET</span>
    </button>
    <button @click="activeTab = 'arcade'" :class="activeTab === 'arcade' ? 'active' : ''" class="bottom-nav-btn">
      <svg class="svg-icon-lg"><use href="#i-gamepad"/></svg>
      <span class="bottom-nav-label">GAME</span>
    </button>
    <template x-if="isOwner">
      <button @click="activeTab = 'owner'" :class="activeTab === 'owner' ? 'active' : ''" class="bottom-nav-btn bg-purple-200 text-purple-900">
        <svg class="svg-icon-lg"><use href="#i-crown"/></svg>
        <span class="bottom-nav-label">OWNER</span>
      </button>
    </template>
  </nav>

</div>

<!-- SVG SYMBOLS DEFINITION -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>

</svg>

<!-- JAVASCRIPT & SUPABASE INTEGRATION -->
<script>
const SUPABASE_URL = 'https://chcfvbqyygtkfcvhywoa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoY2Z2YnF5eWd0a2Zjdmh5d29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NjYxNDAsImV4cCI6MjEwNjQ0MjE0MH0.VjsHm2lIVs--biNLF-ku6K3AyIbUVXylyFY77xjaajM';
const OWNER_EMAIL = 'andikaatka@gmail.com';
const supabaseWindow = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function zenkaiCloudApp(){
  return {
    splashHidden: false,
    splashProgress: 0,
    splashText: 'Menghubungkan ke Cloud Supabase...',
    isAuthenticated: false,
    authMode: 'login',
    authEmail: '',
    authPassword: '',
    authUsername: '',
    
    // Bottom Sheet Custom State
    sheetOpen: false,
    sheetTitle: '',
    sheetMessage: '',
    
    userName: '',
    currentUser: null,
    isOwner: false,
    activeTab: 'home',
    currentTime: '',
    quickNote: '',
    
    // Keuangan
    transactions: [],
    txCategory: '',
    txAmount: '',
    
    // Sholat
    prayerTimes: {subuh:'04:30', dzuhur:'11:55', ashar:'15:10', maghrib:'17:55', isya:'19:05'},
    
    // Game Reflex
    reflexState: 'yellow',
    reflexMessage: 'Tap untuk Mulai',
    reflexStart: 0,
    reflexTimeout: null,
    
    async init(){
      this.runSplash();
      this.updateClock();
      setInterval(() => this.updateClock(), 1000);
      
      // Cek sesi login Supabase saat ini
      const { data: { session } } = await supabaseWindow.auth.getSession();
      if (session) {
        this.currentUser = session.user;
        this.isAuthenticated = true;
        await this.loadCloudData();
      }
    },
    
    runSplash(){
      let p = 0;
      let t = setInterval(() => {
        p += 25;
        this.splashProgress = p;
        if(p >= 100){
          clearInterval(t);
          setTimeout(() => this.splashHidden = true, 300);
        }
      }, 200);
    },
    
    updateClock(){
      this.currentTime = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    },

    showAlert(title, message){
      this.sheetTitle = title;
      this.sheetMessage = message;
      this.sheetOpen = true;
    },
    
    async handleEmailAuth(){
      if(!this.authEmail || !this.authPassword){
        this.showAlert('Perhatian', 'Isi email dan password terlebih dahulu!');
        return;
      }
      try {
        if(this.authMode === 'register'){
          if(!this.authUsername){ this.showAlert('Perhatian', 'Isi nama tampilan terlebih dahulu!'); return; }
          const { error } = await supabaseWindow.auth.signUp({
            email: this.authEmail,
            password: this.authPassword,
            options: { data: { username: this.authUsername } }
          });
          if(error) throw error;
          this.showAlert('Sukses', 'Berhasil mendaftar! Silakan masuk.');
          this.authMode = 'login';
        } else {
          const { data, error } = await supabaseWindow.auth.signInWithPassword({
            email: this.authEmail,
            password: this.authPassword
          });
          if(error) throw error;
          this.currentUser = data.user;
          this.isAuthenticated = true;
          await this.loadCloudData();
          this.showAlert('Sukses', 'Berhasil masuk!');
        }
      } catch(e){
        this.showAlert('Gagal Otentikasi', e.message);
      }
    },

    // Fungsi Login Instan Google OAuth
    async loginWithGoogle(){
      try {
        const { error } = await supabaseWindow.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin
          }
        });
        if(error) throw error;
      } catch(e){
        this.showAlert('Gagal Google Login', e.message);
      }
    },
    
    async loadCloudData(){
      if(!this.currentUser) return;
      
      // VERIFIKASI OWNER MUTLAK BERDASARKAN EMAIL (Bukan Nama Zenkai)
      const userEmail = this.currentUser.email || '';
      this.isOwner = (userEmail.toLowerCase() === OWNER_EMAIL.toLowerCase());

      // Ambil profil dari tabel profiles jika ada
      const { data: profile } = await supabaseWindow.from('profiles').select('*').eq('id', this.currentUser.id).single();
      if(profile){
        this.userName = profile.username;
        this.quickNote = profile.quick_note || '';
      } else {
        this.userName = this.currentUser.user_metadata?.username || userEmail.split('@')[0] || 'User';
      }
      await this.loadTransactions();
    },
    
    async saveQuickNoteCloud(){
      if(!this.currentUser) return;
      await supabaseWindow.from('profiles').update({ quick_note: this.quickNote }).eq('id', this.currentUser.id);
    },
    
    async loadTransactions(){
      if(!this.currentUser) return;
      const { data } = await supabaseWindow.from('transactions').select('*').eq('user_id', this.currentUser.id).order('id', { ascending: false });
      if(data) this.transactions = data;
    },
    
    async addTransaction(type){
      if(!this.currentUser || !this.txCategory || !this.txAmount) return;
      const amount = parseFloat(this.txAmount);
      const { error } = await supabaseWindow.from('transactions').insert({
        user_id: this.currentUser.id,
        type: type,
        category: this.txCategory,
        amount: amount,
        date: new Date().toLocaleDateString('id-ID')
      });
      if(!error){
        this.txCategory = '';
        this.txAmount = '';
        await this.loadTransactions();
      } else {
        this.showAlert('Gagal', 'Gagal tambah transaksi: ' + error.message);
      }
    },
    
    get totalBalance(){
      return this.transactions.reduce((acc, t) => t.type === 'income' ? acc + t.amount : acc - t.amount, 0);
    },
    
    startReflexGame(){
      this.reflexState = 'yellow';
      this.reflexMessage = 'Tunggu Hijau...';
      clearTimeout(this.reflexTimeout);
      let delay = 1500 + Math.random() * 2500;
      this.reflexTimeout = setTimeout(() => {
        this.reflexState = 'green';
        this.reflexMessage = 'TAP SEKARANG!';
        this.reflexStart = Date.now();
      }, delay);
    },
    
    handleReflexTap(){
      if(this.reflexState === 'yellow'){
        clearTimeout(this.reflexTimeout);
        this.reflexState = 'red';
        this.reflexMessage = 'Terlalu Cepat!';
      } else if(this.reflexState === 'green'){
        let time = Date.now() - this.reflexStart;
        this.reflexState = 'yellow';
        this.reflexMessage = `Berhasil: ${time} ms`;
      }
    },
    
    async logout(){
      await supabaseWindow.auth.signOut();
      this.isAuthenticated = false;
      this.currentUser = null;
      window.location.reload();
    }
  }
}
</script>
</body>
</html>
