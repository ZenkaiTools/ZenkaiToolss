<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai // System Override</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg: #030305;
            --glass: rgba(15, 15, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.15);
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Efek Gradient Glow di Background */
        .bg-glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulse 6s infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(100, 0, 255, 0.1) 0%, transparent 60%);
            top: 20%;
            right: 10%;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Container Utama */
        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Kartu Kaca (Glassmorphism) */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Profil */
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent) 0%, #0044ff 100%);
            padding: 3px;
            position: relative;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            border: 3px solid #0a0a0f;
            box-shadow: 0 0 8px var(--accent);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(0, 255, 204, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .bio {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Tombol Menu */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 255, 204, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 204, 0.05);
        }

        /* Garis Accent di Kiri Tombol */
        .link-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 3px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-btn:hover::before {
            opacity: 1;
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .link-btn:hover .icon-box {
            color: var(--accent);
            background: rgba(0, 255, 204, 0.1);
        }

        .text-box {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .chevron {
            color: #333;
            transition: all 0.3s ease;
        }

        .link-btn:hover .chevron {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* Fake Terminal Status */
        .terminal-status {
            background: #000;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #555;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .term-line { display: flex; justify-content: space-between; }
        .term-key { color: #444; }
        .term-val { color: var(--accent); }
        .term-val.warn { color: #ff0055; }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #333;
            text-transform: uppercase;
        }
    </style>
</head>
