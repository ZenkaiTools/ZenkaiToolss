<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai // Core Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg: #020203;
            --primary: #ffffff;
            --accent: #5e17eb; /* Ungu elektrik */
            --accent-glow: rgba(94, 23, 235, 0.4);
            --text-muted: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%);
        }

        .wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* --- ORBIT RINGS BACKGROUND --- */
        .orbit-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            pointer-events: none;
            z-index: 0;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ring-1 {
            width: 200px;
            height: 200px;
            border-top-color: var(--accent);
            border-bottom-color: var(--accent);
            animation: spin 10s linear infinite;
        }

        .ring-2 {
            width: 300px;
            height: 300px;
            border-left-color: rgba(255, 255, 255, 0.2);
            border-right-color: rgba(255, 255, 255, 0.2);
            animation: spinReverse 15s linear infinite;
        }

        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: translate(-50%, -50%) rotate(-360deg); } }

        /* --- PROFIL --- */
        .profile {
            text-align: center;
            position: relative;
            z-index: 2;
            margin-bottom: 50px;
            margin-top: 40px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #000;
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            box-shadow: 0 0 30px var(--accent-glow);
            position: relative;
        }

        /* Titik Scanner di Avatar */
        .avatar::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px dashed rgba(94, 23, 235, 0.5);
            animation: spin 20s linear infinite;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .role {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- MENU TANPA KOTAK --- */
        .menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0; /* Nempel tanpa jarak */
            z-index: 2;
        }

        .menu-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            text-decoration: none;
            color: var(--primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .menu-item:first-child {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Garis Nyala Pas Hover */
        .menu-item::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.4s ease;
        }

        .menu-item:hover::before {
            width: 100%;
        }

        .menu-item:hover {
            padding-left: 15px;
            padding-right: 15px;
            background: linear-gradient(90deg, rgba(94, 23, 235, 0.05), transparent);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .item-num {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: color 0.4s ease;
        }

        .menu-item:hover .item-num {
            color: var(--accent);
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .item-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-icon {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: all 0.4s ease;
            opacity: 0.5;
        }

        .menu-item:hover .item-icon {
            color: var(--accent);
            opacity: 1;
            transform: scale(1.1);
        }

        /* --- FOOTER STATUS --- */
        .footer {
            margin-top: 40px;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: #333;
            text-align: center;
            letter-spacing: 1px;
            z-index: 2;
        }

        .blink {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; color: var(--accent); }
            50% { opacity: 0.3; color: #333; }
        }
    </style>
</head>
