<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talkup RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#0d0d1a;color:#eee;min-height:100vh;padding:12px}
#app{max-width:520px;margin:auto;background:#16162a;border-radius:14px;padding:16px;box-shadow:0 0 30px #000}
h1{text-align:center;color:#7df;margin-bottom:12px;font-size:22px}
h2{color:#fd7;font-size:16px;margin:10px 0 6px}
.panel{background:#1f1f3a;border-radius:10px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.stats div{background:#28284a;padding:6px 8px;border-radius:6px}
button{width:100%;padding:11px;margin:4px 0;background:#3a3a6a;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:.15s}
button:hover{background:#505090;transform:translateY(-1px)}
button.primary{background:#d6336c}
button.primary:hover{background:#f04080}
button.green{background:#2f9e44}
button.green:hover{background:#37b24d}
button:disabled{opacity:.4;cursor:not-allowed}
#log{font-size:12px;max-height:140px;overflow-y:auto;background:#0a0a18;padding:8px;border-radius:8px;margin-top:8px;color:#9cf;line-height:1.5}
#log div{padding:2px 0;border-bottom:1px solid #222}
.row{display:flex;gap:6px}
.row button{margin:4px 0}
.hidden{display:none}
.bar{height:8px;background:#28284a;border-radius:4px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;transition:.3s}
.hp-fill{background:linear-gradient(90deg,#e63946,#ff6b6b)}
.mp-fill{background:linear-gradient(90deg,#1e6091,#4dabf7)}
.exp-fill{background:linear-gradient(90deg,#f08c00,#ffd43b)}
</style>
</head>
<body>
<div id="app">
<h1>⚔️ Talkup RPG</h1>

<!-- MENU -->
<div id="menu" class="panel">
  <h2>Menu Utama</h2>
  <button class="primary" onclick="newGame()">🆕 Game Baru</button>
  <button class="green" onclick="loadGame()">💾 Load Game</button>
  <button onclick="showHelp()">❓ Cara Main</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">
  <div class="panel">
    <div class="stats">
      <div>👤 <span id="pNama">-</span></div>
      <div>🎖️ Lv <span id="pLv">1</span></div>
      <div>❤️ HP <span id="pHp">100</span>/<span id="pMhp">100</span></div>
      <div>💧 MP <span id="pMp">50</span>/<span id="pMmp">50</span></div>
      <div>⚔️ ATK <span id="pAtk">10</span></div>
      <div>🛡️ DEF <span id="pDef">5</span></div>
      <div>💰 Gold <span id="pGold">50</span></div>
      <div>🍀 LUCK <span id="pLuck">5</span></div>
    </div>
    <div class="bar"><div id="hpBar" class="bar-fill hp-fill" style="width:100%"></div></div>
    <div class="bar"><div id="mpBar" class="bar-fill mp-fill" style="width:100%"></div></div>
    <div class="bar"><div id="expBar" class="bar-fill exp-fill" style="width:0%"></div></div>
  </div>

  <div class="panel" id="mainActions">
    <h2>Aksi</h2>
    <button onclick="explore()">🌲 Jelajah Hutan</button>
    <button onclick="dungeon()">🏰 Masuk Dungeon</button>
    <button onclick="openShop()">🏪 Toko</button>
    <button onclick="openInventory()">🎒 Inventory</button>
    <button onclick="openQuest()">📜 Quest</button>
    <button class="green" onclick="saveGame()">💾 Simpan</button>
  </div>

  <!-- COMBAT -->
  <div id="combatPanel" class="panel hidden">
    <h2>⚔️ Pertarungan</h2>
    <div id="combatInfo">-</div>
    <div class="bar"><div id="mHpBar" class="bar-fill hp-fill" style="width:100%"></div></div>
    <div class="row">
      <button onclick="attack()">🗡️ Serang</button>
      <button onclick="useSkill()">✨ Skill (10 MP)</button>
    </div>
    <div class="row">
      <button onclick="usePotion()">🧪 Potion</button>
      <button onclick="flee()">🏃 Kabur</button>
    </div>
  </div>

  <!-- INVENTORY -->
  <div id="invPanel" class="panel hidden">
    <h2>🎒 Inventory</h2>
    <div id="invList"></div>
    <button onclick="closePanels()">⬅️ Kembali</button>
  </div>

  <!-- SHOP -->
  <div id="shopPanel" class="panel hidden">
    <h2>🏪 Toko</h2>
    <div id="shopList"></div>
    <button onclick="closePanels()">⬅️ Kembali</button>
  </div>

  <!-- QUEST -->
  <div id="questPanel" class="panel hidden">
    <h2>📜 Quest</h2>
    <div id="questList"></div>
    <button onclick="closePanels()">⬅️ Kembali</button>
  </div>

  <div id="log"></div>
</div>

</div>
<script>
// ===== STATE =====
let P = null;
const SAVE_KEY = "talkup_save_v1";

// ===== ITEM DATABASE =====
const ITEMS = {
  potion:  { nama:"🧪 Potion",   harga:20,  efek:{hp:30} },
  ether:   { nama:"💧 Ether",    harga:30,  efek:{mp:20} },
  sword:   { nama:"🗡️ Sword",    harga:80,  efek:{atk:5} },
  shield:  { nama:"🛡️ Shield",   harga:70,  efek:{def:4} },
  amulet:  { nama:"🍀 Amulet",   harga:120, efek:{luck:5} },
  elixir:  { nama:"🌟 Elixir",   harga:150, efek:{hp:100,mp:100} }
};

// ===== MONSTER DATABASE =====
const MONSTERS = [
  { nama:"🐺 Serigala",   hp:40,  atk:8,  def:2, exp:15, gold:12 },
  { nama:"👹 Goblin",     hp:60,  atk:12, def:4, exp:25, gold:20 },
  { nama:"🦇 Kelelawar",  hp:30,  atk:10, def:1, exp:12, gold:8 },
  { nama:"🐉 Naga Kecil", hp:120, atk:20, def:8, exp:60, gold:60 },
  { nama:"💀 Skeleton",   hp:80,  atk:15, def:6, exp:35, gold:28 }
];

// ===== QUESTS =====
const QUESTS = [
  { id:"q1", nama:"Bunuh 3 Serigala", target:"🐺 Serigala", butuh:3, reward:{exp:50,gold:40}, progress:0, selesai:false },
  { id:"q2", nama:"Bunuh 2 Goblin",   target:"👹 Goblin",   butuh:2, reward:{exp:60,gold:50}, progress:0, selesai:false },
  { id:"q3", nama:"Bunuh 1 Naga",     target:"🐉 Naga Kecil", butuh:1, reward:{exp:200,gold:200}, progress:0, selesai:false }
];

// ===== CORE =====
function newGame() {
  const nama = prompt("Nama karaktermu:", "Pemain");
  if (!nama) return;
  P = {
    nama, lv:1, exp:0, expNext:50,
    hp:100, mhp:100, mp:50, mmp:50,
    atk:10, def:5, luck:5, gold:50,
    inv:{ potion:3 },
    quests: JSON.parse(JSON.stringify(QUESTS)),
    monster:null
  };
  log("🎮 Game dimulai. Selamat datang, " + nama + "!");
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  render();
}

function render() {
  if (!P) return;
  document.getElementById("pNama").textContent = P.nama;
  document.getElementById("pLv").textContent = P.lv;
  document.getElementById("pHp").textContent = P.hp;
  document.getElementById("pMhp").textContent = P.mhp;
  document.getElementById("pMp").textContent = P.mp;
  document.getElementById("pMmp").textContent = P.mmp;
  document.getElementById("pAtk").textContent = P.atk;
  document.getElementById("pDef").textContent = P.def;
  document.getElementById("pGold").textContent = P.gold;
  document.getElementById("pLuck").textContent = P.luck;
  document.getElementById("hpBar").style.width = (P.hp/P.mhp*100) + "%";
  document.getElementById("mpBar").style.width = (P.mp/P.mmp*100) + "%";
  document.getElementById("expBar").style.width = (P.exp/P.expNext*100) + "%";
}

function log(msg) {
  const el = document.getElementById("log");
  const d = document.createElement("div");
  d.textContent = msg;
  el.prepend(d);
}

// ===== EXPLORE =====
function explore() {
  if (!P || P.monster) return;
  const roll = Math.random();
  if (roll < 0.65) startCombat();
  else if (roll < 0.8) {
    const gold = Math.floor(Math.random()*20)+5;
    P.gold += gold;
    log("💰 Kamu menemukan " + gold + " gold.");
    render();
  } else if (roll < 0.92) {
    P.inv.potion = (P.inv.potion||0) + 1;
    log("🧪 Kamu menemukan Potion.");
    render();
  } else {
    const dmg = Math.floor(Math.random()*10)+5;
    P.hp = Math.max(1, P.hp - dmg);
    log("💥 Kamu kena jebakan! -" + dmg + " HP");
    render();
  }
}

function dungeon() {
  if (!P || P.monster) return;
  const m = MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
  m.hp *= 1.5; m.atk *= 1.3; m.exp *= 2; m.gold *= 2;
  startCombat(m);
  log("🏰 Kamu masuk dungeon yang lebih berbahaya!");
}

// ===== COMBAT =====
function startCombat(custom) {
  const base = custom || MONSTERS[Math.floor(Math.random()*MONSTERS.length)];
  P.monster = {
    nama: base.nama,
    hp: base.hp, mhp: base.hp,
    atk: base.atk, def: base.def,
    exp: base.exp, gold: base.gold
  };
  log("⚔️ " + P.monster.nama + " muncul!");
  document.getElementById("combatPanel").classList.remove("hidden");
  updateCombat();
}

function updateCombat() {
  if (!P.monster) return;
  const m = P.monster;
  document.getElementById("combatInfo").textContent =
    m.nama + " — HP " + m.hp + "/" + m.mhp;
  document.getElementById("mHpBar").style.width = (m.hp/m.mhp*100) + "%";
}

function attack() {
  if (!P.monster) return;
  const m = P.monster;
  const dmg = Math.max(1, P.atk - m.def + Math.floor(Math.random()*5));
  m.hp -= dmg;
  log("🗡️ Kamu menyerang " + m.nama + " -" + dmg);
  if (m.hp <= 0) return winCombat();
  monsterTurn();
}

function useSkill() {
  if (!P.monster) return;
  if (P.mp < 10) { log("💧 MP tidak cukup."); return; }
  P.mp -= 10;
  const m = P.monster;
  const dmg = Math.max(1, Math.floor(P.atk * 2.5) - m.def);
  m.hp -= dmg;
  log("✨ Skill! -" + dmg + " ke " + m.nama);
  render();
  if (m.hp <= 0) return winCombat();
  monsterTurn();
}

function usePotion() {
  if (!P.monster) return;
  if (!P.inv.potion) { log("🧪 Tidak ada potion."); return; }
  P.inv.potion--;
  P.hp = Math.min(P.mhp, P.hp + 30);
  log("🧪 Kamu pakai Potion. +30 HP");
  render();
  monsterTurn();
}

function flee() {
  if (!P.monster) return;
  if (Math.random() < 0.5 + P.luck*0.02) {
    log("🏃 Kamu berhasil kabur.");
    P.monster = null;
    document.getElementById("combatPanel").classList.add("hidden");
  } else {
    log("❌ Gagal kabur!");
    monsterTurn();
  }
}

function monsterTurn() {
  if (!P.monster) return;
  const m = P.monster;
  const dmg = Math.max(1, m.atk - P.def + Math.floor(Math.random()*4));
  P.hp -= dmg;
  log("👊 " + m.nama + " menyerangmu -" + dmg);
  render();
  updateCombat();
  if (P.hp <= 0) return loseCombat();
}

function winCombat() {
  const m = P.monster;
  log("🏆 " + m.nama + " dikalahkan! +" + m.exp + " exp, +" + m.gold + " gold");
  P.exp += m.exp;
  P.gold += m.gold;
  updateQuest(m.nama);
  checkLevel();
  P.monster = null;
  document.getElementById("combatPanel").classList.add("hidden");
  render();
}

function loseCombat() {
  log("💀 Kamu kalah. Kembali ke kota dengan 1 HP.");
  P.hp = 1;
  P.gold = Math.floor(P.gold/2);
  P.monster = null;
  document.getElementById("combatPanel").classList.add("hidden");
  render();
}

function checkLevel() {
  while (P.exp >= P.expNext) {
    P.exp -= P.expNext;
    P.lv++;
    P.expNext = Math.floor(P.expNext * 1.5);
    P.mhp += 20; P.mmp += 10;
    P.atk += 3; P.def += 2; P.luck += 1;
    P.hp = P.mhp; P.mp = P.mmp;
    log("🎉 LEVEL UP! Sekarang Lv " + P.lv);
  }
}

// ===== QUEST =====
function updateQuest(monsterName) {
  P.quests.forEach(q => {
    if (!q.selesai && q.target === monsterName) {
      q.progress++;
      if (q.progress >= q.butuh) {
        q.selesai = true;
        P.exp += q.reward.exp;
        P.gold += q.reward.gold;
        log("✅ Quest selesai: " + q.nama + " (+" + q.reward.exp + " exp)");
        checkLevel();
      }
    }
  });
}

// ===== UI PANELS =====
function closePanels() {
  document.querySelectorAll("#invPanel,#shopPanel,#questPanel").forEach(p => p.classList.add("hidden"));
  document.getElementById("mainActions").classList.remove("hidden");
}

function openInventory() {
  const el = document.getElementById("invList");
  el.innerHTML = "";
  if (!Object.keys(P.inv).length) el.innerHTML = "<p>Kosong.</p>";
  Object.entries(P.inv).forEach(([k,v]) => {
    el.innerHTML += "<div>" + ITEMS[k].nama + " x" + v + "</div>";
  });
  document.getElementById("mainActions").classList.add("hidden");
  document.getElementById("invPanel").classList.remove("hidden");
}

function openShop() {
  const el = document.getElementById("shopList");
  el.innerHTML = "";
  Object.entries(ITEMS).forEach(([key,it]) => {
    const b = document.createElement("button");
    b.textContent = it.nama + " - " + it.harga + "g";
    b.onclick = () => buyItem(key);
    el.appendChild(b);
  });
  document.getElementById("mainActions").classList.add("hidden");
  document.getElementById("shopPanel").classList.remove("hidden");
}

function buyItem(key) {
  const it = ITEMS[key];
  if (P.gold < it.harga) { log("💰 Gold kurang."); return; }
  P.gold -= it.harga;
  P.inv[key] = (P.inv[key]||0) + 1;
  if (it.efek.atk) P.atk += it.efek.atk;
  if (it.efek.def) P.def += it.efek.def;
  if (it.efek.luck) P.luck += it.efek.luck;
  log("🛒 Beli " + it.nama);
  render();
}

function openQuest() {
  const el = document.getElementById("questList");
  el.innerHTML = "";
  P.quests.forEach(q => {
    el.innerHTML += "<div>" + (q.selesai?"✅":"📜") + " " + q.nama +
      " (" + q.progress + "/" + q.butuh + ")</div>";
  });
  document.getElementById("mainActions").classList.add("hidden");
  document.getElementById("questPanel").classList.remove("hidden");
}

// ===== SAVE/LOAD =====
function saveGame() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(P));
  log("💾 Game disimpan.");
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) { alert("Belum ada save."); return; }
  P = JSON.parse(raw);
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  log("💾 Game dimuat.");
  render();
}

function showHelp() {
  alert("Cara main:\n- Jelajah Hutan untuk cari monster/item\n- Masuk Dungeon untuk lawan kuat\n- Serang, pakai skill, atau potion\n- Beli item di Toko\n- Simpan supaya tidak hilang");
}
</script>
</body>
</html>
